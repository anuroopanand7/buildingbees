<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildingBees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Neutral ladder: paper, surfaces, hairlines, ink. */
    --bg: #f7f7f5; --panel: #ffffff; --card: #ffffff; --line: #e6e5e1; --line-strong: #cfcdc7;
    --text: #111110; --muted: #6b6a66; --fill: #efeeea;
    /* Honey is the brand hue: the mark and the current selection only. Never a status. */
    --accent: #f5b301; --sel: #fff8e0;
    /* Status colours are fixed and always paired with a label. */
    --ok: #12805c; --ok-soft: #e4f4ed; --warn: #b45f06; --warn-soft: #fdf0dc; --bad: #c8321f; --bad-soft: #fdebe8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .hex { width: 22px; height: 22px; background: var(--accent); clip-path: polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%); }
  .product { color: var(--muted); }
  .pill { margin-left: auto; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.on { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .pill.off { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  main { display: grid; grid-template-columns: 300px 1fr 360px; height: calc(100vh - 53px); }
  aside, section { overflow: auto; padding: 16px; }
  main > section, .gate { background-image: radial-gradient(var(--line-strong) 1px, transparent 1px); background-size: 20px 20px; }
  main > section { background-color: var(--bg); position: relative; }
  aside.left { border-right: 1px solid var(--line); background: var(--panel); }
  aside.right { border-left: 1px solid var(--line); background: var(--panel); }
  h2 { font: 500 11px/1.4 "JetBrains Mono", ui-monospace, monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  textarea { width: 100%; min-height: 200px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font: 13px/1.4 Inter, sans-serif; resize: vertical; }
  .btn { width: 100%; padding: 10px 14px; border-radius: 999px; border: 1px solid transparent; background: var(--fill); color: var(--text); margin-top: 8px; font-weight: 500; transition: background .15s; }
  .btn:hover { background: #e6e5e0; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .btn.primary { background: var(--text); color: #fff; }
  .btn.primary:hover { background: #2b2b29; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .file { display: block; margin-top: 8px; padding: 9px 12px; border: 1px dashed var(--line-strong); border-radius: 999px; color: var(--muted); text-align: center; cursor: pointer; }
  .file input { display: none; }
  .msg { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 18px; }
  .msg.err { color: var(--bad); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; letter-spacing: -.02em; }
  .stat span { font-size: 11px; color: var(--muted); }
  .crumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
  .crumbs button { background: none; border: none; color: var(--text); padding: 0; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .board { display: grid; grid-template-columns: repeat(5, minmax(140px, 1fr)); gap: 10px; align-items: start; }
  .col h2 { display: flex; justify-content: space-between; }
  .node { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
  .node:hover { border-color: var(--line-strong); }
  .node.sel { border-color: var(--accent); background: var(--sel); box-shadow: 0 0 0 1px var(--accent); }
  .node.dim { opacity: .35; }
  .node .t { font-weight: 600; font-size: 13px; }
  .node .id { color: var(--muted); margin-top: 2px; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .badge { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; }
  .badge.block { background: var(--bad-soft); color: var(--bad); }
  .badge.ready { background: var(--ok-soft); color: var(--ok); }
  .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 12px; margin-bottom: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-word; }
  .kv dd.missing { color: var(--bad); }
  .q { background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .q.nb { border-left-color: var(--warn); }
  .q.done { border-left-color: var(--ok); }
  .q .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .q input { width: 100%; margin-top: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font: inherit; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); text-align: left; }
  .chip:hover { background: var(--text); color: #fff; border-color: var(--text); }
  .score { font-size: 32px; font-weight: 700; letter-spacing: -.03em; }
  .reasons { font-size: 12px; color: var(--muted); padding-left: 16px; margin: 6px 0 14px; }
  .working { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(247,247,245,.86); z-index: 5; }
  .working[hidden] { display: none; }
  .working-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px 28px; text-align: center; min-width: 280px; box-shadow: 0 6px 24px rgba(17,17,16,.06); }
  .spinner { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid var(--fill); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .working b { display: block; font-size: 15px; }
  .working span { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .pm-q { font-size: 17px; line-height: 1.4; font-weight: 600; letter-spacing: -.01em; margin: 6px 0 12px; }
  .pm-about { font-size: 12px; color: var(--muted); }
  .pm-about button, .linkbtn { background: none; border: none; padding: 0; color: var(--text); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; font-size: 12px; }
  .pm-progress { height: 4px; background: var(--fill); border-radius: 4px; margin: 0 0 16px; overflow: hidden; }
  .pm-progress i { display: block; height: 100%; background: var(--text); transition: width .3s; }
  .pm-chips { display: grid; gap: 8px; margin-bottom: 10px; }
  .pm-chips .chip { font-size: 13px; padding: 10px 14px; border-radius: 12px; }
  .pm-input { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 12px; font: inherit; }
  .pm-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
  .tag.nb { background: var(--warn-soft); color: var(--warn); }
  .pm-list { list-style: none; padding: 0; margin: 8px 0 16px; font-size: 13px; }
  .pm-list li { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .gate[hidden] { display: none; }
  .gate-box { max-width: 720px; width: 100%; }
  .gate h1 { font-size: 34px; letter-spacing: -.03em; margin: 0 0 8px; }
  .gate p { color: var(--muted); margin: 0 0 20px; }
  .engines { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .engine { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; color: var(--text); transition: border-color .15s, box-shadow .15s; }
  .engine:hover { border-color: var(--text); box-shadow: 0 6px 24px rgba(17,17,16,.06); }
  .engine b { display: block; font-size: 17px; margin-bottom: 4px; }
  .engine small { display: block; color: var(--muted); margin-bottom: 10px; }
  .engine .mono { color: var(--muted); }
  .chip-engine { background: var(--fill); border: none; color: var(--text); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 500; }
  @media (max-width: 640px) { .engines { grid-template-columns: 1fr; } }
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; height: auto; }
    aside.left, aside.right { border: none; border-bottom: 1px solid var(--line); }
    .board { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="hex"></div>BuildingBees</div>
  <div class="product" id="product"></div>
  <div class="pill" id="status">Checking engine...</div>
  <button class="chip-engine" id="switchEngine">Switch engine</button>
</header>
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="logo" style="margin-bottom:28px"><div class="hex"></div>BuildingBees</div>
    <h1>Choose your AI engine</h1>
    <p>BuildingBees runs every spec read and every Socratic question on one engine. Pick one to continue.</p>
    <div class="engines" id="engineCards"></div>
  </div>
</div>
<main>
  <aside class="left">
    <h2>1. Bring your spec</h2>
    <textarea id="prd" placeholder="Paste a PRD, feature brief or user story. the AI turns it into Users, Flows, Screens, CTAs and APIs, then asks about everything the spec leaves out."></textarea>
    <button class="btn primary" id="buildBtn">Build graph</button>
    <label class="file">or upload a PDF / .md file<input type="file" id="file" accept=".pdf,.md,.txt"></label>
    <button class="btn" id="exampleBtn">Try an example spec</button>
    <button class="btn" id="sampleBtn">Clear board</button>
    <div class="msg" id="msg"></div>
    <div class="stats" id="stats"></div>
  </aside>

  <section>
    <div class="working" id="working" hidden role="status" aria-live="polite">
      <div class="working-card"><div class="spinner"></div><b id="workingTitle"></b><span id="workingStep"></span><span class="mono" id="workingTime"></span></div>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="board" id="board"></div>
  </section>

  <aside class="right" id="inspector">
    <h2>Your product manager</h2>
  </aside>
</main>

<script>
const LAYERS = ["USER", "FLOW", "SCREEN", "CTA", "API"];
const LABEL = { USER: "Users", FLOW: "Flows", SCREEN: "Screens", CTA: "CTAs", API: "APIs" };
let S = { nodes: {}, fwd: {}, rev: {}, screens: {}, engines: {}, engine: null, selected: null };
// The product manager: it asks one question at a time and digs for more on its own.
const MAX_ROUNDS = 3; // shortcut: caps automatic deep-dives per board to protect the free model quota
let PM = { skipped: new Set(), asked: new Set(), rounds: 0, thinking: "", error: "", focus: null };
const resetPM = () => { PM = { skipped: new Set(), asked: new Set(), rounds: 0, thinking: "", error: "", focus: null }; };
try { S.engine = localStorage.getItem("bb_engine"); } catch (e) {}
const ENGINE_COPY = {
  gemini: ["Google Gemini", "Google AI Builder Cup track. Reads PDFs natively."],
  nvidia: ["NVIDIA Nemotron", "Nebius x NVIDIA track. Runs on Nebius Token Factory."],
};
const eq = () => `engine=${encodeURIComponent(S.engine)}`;
const engineReady = () => !!(S.engine && S.engines[S.engine] && S.engines[S.engine].enabled);

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Each browser gets its own board; the server keys boards by this id.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let BOARD = store.get("bb_board");
if (!BOARD) { BOARD = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)); store.set("bb_board", BOARD); }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), "X-Board": BOARD } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `Request failed (${res.status})`);
  return body;
}
function say(text, err = false) { $("msg").textContent = text; $("msg").className = "msg" + (err ? " err" : ""); }
function busy(on) { $("sampleBtn").disabled = on; $("buildBtn").disabled = on || !engineReady(); }

let restoring = false;
async function load() {
  let [g, screens, status] = await Promise.all([api("/api/graph"), api("/api/screens"), api("/api/status")]);
  const cached = store.get("bb_graph");
  if (!g.total_nodes && cached && !restoring) {
    // The server slept and lost this board; put back the copy this browser kept.
    restoring = true;
    try { await api("/api/restore", { method: "POST", headers: { "Content-Type": "application/json" }, body: cached }); return await load(); }
    catch (e) { store.set("bb_graph", ""); }
    finally { restoring = false; }
  }
  store.set("bb_graph", g.total_nodes ? JSON.stringify({ product_name: g.product_name, nodes: g.nodes, edges: g.edges }) : "");
  S.nodes = {}; S.fwd = {}; S.rev = {}; S.screens = {};
  g.nodes.forEach((n) => (S.nodes[n.id] = n));
  g.edges.forEach((e) => {
    (S.fwd[e.source] ||= []).push(e.target);
    (S.rev[e.target] ||= []).push(e.source);
  });
  screens.forEach((r) => (S.screens[r.screen_id] = r));
  S.engines = status.engines;
  if (S.engine && !S.engines[S.engine]) S.engine = null;
  $("product").textContent = status.product_name;
  renderEngine();
  if (S.selected && !S.nodes[S.selected]) S.selected = null;
  render();
}

const questionsFor = (id) => Object.values(S.nodes).filter((n) => n.layer === "QUESTION" && n.target_node_id === id);
const openBlocking = (id) => questionsFor(id).filter((q) => q.question_status === "OPEN" && q.is_blocking).length;

// Everything connected to the selection, up and down, so the board "zooms" into one path.
function related(id) {
  const seen = new Set([id]);
  const walk = (start, map) => {
    const stack = [start];
    while (stack.length) for (const nx of map[stack.pop()] || []) if (!seen.has(nx)) { seen.add(nx); stack.push(nx); }
  };
  walk(id, S.fwd); walk(id, S.rev);
  return seen;
}
function screenOf(id) {
  const n = S.nodes[id];
  if (!n) return null;
  if (n.layer === "SCREEN") return id;
  if (n.layer === "CTA") return n.parent_screen_id;
  if (n.layer === "API") return (S.rev[id] || []).map((c) => S.nodes[c]?.parent_screen_id).find(Boolean) || null;
  return null;
}
function color(score) { return score >= 0.8 ? "var(--ok)" : score > 0 ? "var(--warn)" : "var(--bad)"; }

function render() {
  const all = Object.values(S.nodes);
  PM.focus = S.selected ? null : (pmQueue()[0]?.target_node_id || null);
  const focus = S.selected || PM.focus;
  const rel = focus ? related(focus) : null;

  const crumbs = ['<button data-id="">All</button>'];
  if (S.selected) {
    const chain = [S.selected];
    let cur = S.selected;
    while ((S.rev[cur] || []).length && chain.length < 6) {
      cur = S.rev[cur].find((p) => S.nodes[p] && S.nodes[p].layer !== "QUESTION");
      if (!cur) break;
      chain.unshift(cur);
    }
    chain.forEach((id) => crumbs.push(`<span>/</span><button data-id="${esc(id)}">${esc(S.nodes[id].title)}</button>`));
  }
  $("crumbs").innerHTML = crumbs.join(" ");

  $("board").innerHTML = LAYERS.map((layer) => {
    const items = all.filter((n) => n.layer === layer);
    const cards = items.map((n) => {
      const ob = openBlocking(n.id);
      const r = layer === "SCREEN" ? S.screens[n.id] : null;
      const cls = ["node", n.id === focus ? "sel" : "", rel && !rel.has(n.id) ? "dim" : ""].join(" ");
      return `<div class="${cls}" data-id="${esc(n.id)}">
        <div class="t">${esc(n.layer === "CTA" ? `"${n.label}"` : n.title)}</div>
        <div class="id mono">${esc(n.id)}</div>
        ${r ? `<div class="bar"><i style="width:${Math.max(4, r.readiness_score * 100)}%;background:${color(r.readiness_score)}"></i></div>` : ""}
        ${ob ? `<span class="badge block">${ob} blocking</span>` : r && r.is_build_ready ? '<span class="badge ready">Ready to build</span>' : ""}
      </div>`;
    }).join("") || '<div class="empty">None yet</div>';
    return `<div class="col"><h2><span>${LABEL[layer]}</span><span>${items.length}</span></h2>${cards}</div>`;
  }).join("");

  const qs = all.filter((n) => n.layer === "QUESTION");
  const rs = Object.values(S.screens);
  $("stats").innerHTML = [
    [all.length - qs.length, "spec nodes"],
    [qs.filter((q) => q.question_status === "OPEN" && q.is_blocking).length, "open blocking"],
    [qs.filter((q) => q.question_status === "ANSWERED").length, "answered"],
    [`${rs.filter((r) => r.is_build_ready).length}/${rs.length}`, "screens ready"],
  ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

  renderInspector();
}

const FIELDS = {
  USER: [["description", "About"]],
  FLOW: [["goal", "Goal"]],
  SCREEN: [["description", "Purpose"], ["states.loading", "Loading"], ["states.empty", "Empty"], ["states.error", "Error"]],
  CTA: [["apis_called", "Calls"], ["target_screen_on_success", "On success"], ["target_screen_on_failure", "On failure"], ["max_retries", "Max retries"]],
  API: [["method", "Method"], ["path", "Path"], ["service", "Service"], ["vendor", "Vendor"], ["timeout_ms", "Timeout (ms)"]],
};
const pick = (o, path) => path.split(".").reduce((v, k) => (v == null ? v : v[k]), o);

function renderInspector() {
  const el = $("inspector");
  const n = S.nodes[S.selected];
  if (!n) return renderInterview(el);
  const rows = (FIELDS[n.layer] || []).map(([path, label]) => {
    let v = pick(n, path);
    if (Array.isArray(v)) v = v.join(", ");
    const missing = v === "" || v == null || (path === "timeout_ms" && !v);
    return `<dt>${label}</dt><dd class="${missing ? "missing" : ""}">${missing ? "Not specified" : esc(v)}</dd>`;
  }).join("");

  const sid = screenOf(n.id);
  const r = sid && S.screens[sid];
  const readiness = r ? `<h2>Branch readiness: ${esc(sid)}</h2>
    <div class="score" style="color:${color(r.readiness_score)}">${Math.round(r.readiness_score * 100)}%</div>
    <ul class="reasons">${r.completeness_reasons.map((x) => `<li>${esc(x)}</li>`).join("") || "<li>Every blocking question answered. Agents may build.</li>"}</ul>` : "";

  const qs = questionsFor(n.id);
  const qhtml = qs.map((q) => {
    const done = q.question_status !== "OPEN";
    return `<div class="q ${done ? "done" : q.is_blocking ? "" : "nb"}">
      <div class="meta">${esc(q.category)} · ${q.is_blocking ? "Blocking" : "Non-blocking"} · for ${esc(q.assigned_to)}${q.metadata?.source ? ` · asked by ${esc(q.metadata.source)}` : ""}</div>
      <div>${esc(q.question_text)}</div>
      ${done ? `<div class="meta" style="margin-top:6px;color:var(--ok)">Answer: ${esc(q.answer_text)}</div>` : `
        ${q.suggested_options?.length ? `<div class="chips">${q.suggested_options.map((o) => `<button class="chip" data-q="${esc(q.id)}" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}
        <input placeholder="Type the decision and press Enter" data-answer="${esc(q.id)}">`}
    </div>`;
  }).join("") || '<div class="empty">No questions on this node yet.</div>';

  el.innerHTML = `<button class="linkbtn" id="backBtn" style="margin-bottom:14px">Back to your product manager</button>
    <h2>${esc(n.layer)}</h2>
    <div style="font-weight:600;font-size:16px">${esc(n.title)}</div>
    <div class="mono" style="color:var(--muted);margin-bottom:12px">${esc(n.id)}</div>
    <dl class="kv">${rows}</dl>
    ${readiness}
    <h2>Questions (${qs.length})</h2>
    ${qhtml}
    <div class="msg" id="imsg"></div>`;
}

const openQuestions = () => Object.values(S.nodes).filter((n) => n.layer === "QUESTION" && n.question_status === "OPEN");
const pmQueue = () => openQuestions().filter((q) => !PM.skipped.has(q.id)).sort((a, b) => (b.is_blocking - a.is_blocking));

// Next node worth a deeper look: buttons first (they tie screens to APIs), then APIs, then screens,
// and always inside a branch that is not ready yet before one that is.
function pmNextTarget() {
  const rank = { CTA: 0, API: 1, SCREEN: 2 };
  return Object.values(S.nodes)
    .filter((n) => n.layer in rank && !PM.asked.has(n.id))
    .sort((a, b) => {
      const ra = S.screens[screenOf(a.id)]?.is_build_ready ? 1 : 0, rb = S.screens[screenOf(b.id)]?.is_build_ready ? 1 : 0;
      return ra - rb || rank[a.layer] - rank[b.layer];
    })[0] || null;
}

async function pmDigDeeper() {
  const target = pmNextTarget();
  if (!target || PM.thinking) return;
  PM.thinking = target.title; PM.error = ""; PM.asked.add(target.id); PM.rounds++;
  renderInspector();
  try {
    const res = await api(`/api/nodes/${encodeURIComponent(target.id)}/interrogate?${eq()}`, { method: "POST" });
    if (!res.added.length && PM.rounds < MAX_ROUNDS) { PM.thinking = ""; return pmDigDeeper(); }
  } catch (err) { PM.error = err.message; PM.rounds = MAX_ROUNDS; }
  PM.thinking = "";
  await load();
}

function renderInterview(el) {
  const total = Object.values(S.nodes).filter((n) => n.layer === "QUESTION").length;
  const open = openQuestions();
  const q = pmQueue()[0];
  const head = '<h2>Your product manager</h2>';
  if (!Object.keys(S.nodes).length) {
    el.innerHTML = head + '<div class="empty">Give me a spec or even a rough idea on the left. I will map it, then ask you about everything it leaves out, one question at a time.</div>';
    return;
  }
  if (PM.thinking) {
    el.innerHTML = head + `<div class="working-card" style="margin-top:24px"><div class="spinner"></div><b>Looking deeper</b><span>Checking "${esc(PM.thinking)}" for gaps...</span></div>`;
    return;
  }
  if (q) {
    const t = S.nodes[q.target_node_id];
    const done = total - open.length;
    el.innerHTML = head + `
      <div class="pm-progress"><i style="width:${total ? (done / total) * 100 : 0}%"></i></div>
      <div class="pm-about">Question ${done + 1} of ${total} · about <button data-id="${esc(q.target_node_id)}" class="pm-open">${esc(t ? t.title : q.target_node_id)}</button></div>
      <div class="pm-q">${esc(q.question_text)}</div>
      <div style="margin-bottom:12px"><span class="tag ${q.is_blocking ? "" : "nb"}">${q.is_blocking ? "Blocks the build" : "Good to know"}</span></div>
      ${q.suggested_options?.length ? `<div class="pm-chips">${q.suggested_options.map((o) => `<button class="chip" data-q="${esc(q.id)}" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}
      <input class="pm-input" placeholder="Or type your own decision and press Enter" data-answer="${esc(q.id)}">
      <div class="pm-row"><button class="linkbtn" data-skip="${esc(q.id)}">Not sure, park it</button><span class="pm-about">${open.length - 1} more waiting</span></div>`;
    return;
  }
  // Nothing left to ask right now: look for more on its own, up to the cap.
  if (PM.rounds < MAX_ROUNDS && engineReady() && pmNextTarget()) { pmDigDeeper(); return; }

  const screens = Object.values(S.screens);
  const ready = screens.filter((r) => r.is_build_ready);
  const notReady = screens.filter((r) => !r.is_build_ready);
  el.innerHTML = head + `
    <div class="score" style="color:${ready.length === screens.length ? "var(--ok)" : "var(--text)"}">${ready.length} of ${screens.length}</div>
    <div class="pm-about" style="margin-bottom:12px">screens are ready to build</div>
    ${PM.error ? `<div class="msg err">${esc(PM.error)}</div>` : ""}
    ${notReady.length ? `<h2>Still need answers</h2><ul class="pm-list">${notReady.map((r) => `<li><button class="linkbtn pm-open" data-id="${esc(r.screen_id)}">${esc(S.nodes[r.screen_id]?.title || r.screen_id)}</button><span class="pm-about">${Math.round(r.readiness_score * 100)}%</span></li>`).join("")}</ul>` : '<div class="empty">Every blocking question is answered. This spec is safe to hand to engineers or coding agents.</div>'}
    ${PM.skipped.size ? `<button class="btn" id="pmParked">Review ${PM.skipped.size} parked question${PM.skipped.size > 1 ? "s" : ""}</button>` : ""}
    ${pmNextTarget() && engineReady() ? '<button class="btn primary" id="pmMore">Keep going, look for more gaps</button>' : ""}`;
}

async function answer(qid, text) {
  if (!text.trim()) return;
  await api(`/api/questions/${encodeURIComponent(qid)}/resolve`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answer_text: text }),
  });
  await load();
}

document.addEventListener("click", async (e) => {
  const node = e.target.closest("[data-id]");
  if (node && (node.classList.contains("node") || node.classList.contains("pm-open") || node.closest("#crumbs"))) {
    S.selected = node.dataset.id || null;
    return render();
  }
  if (e.target.id === "backBtn") { S.selected = null; return render(); }
  if (e.target.dataset.skip) { PM.skipped.add(e.target.dataset.skip); return render(); }
  if (e.target.id === "pmParked") { PM.skipped.clear(); return render(); }
  if (e.target.id === "pmMore") { PM.rounds = 0; return pmDigDeeper(); }
  if (e.target.dataset.opt) return answer(e.target.dataset.q, e.target.dataset.opt).catch((err) => say(err.message, true));
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset.answer) answer(e.target.dataset.answer, e.target.value).catch((err) => say(err.message, true));
});

const STEPS = ["Reading the spec", "Mapping users and flows", "Laying out screens and buttons", "Linking APIs", "Looking for what the spec leaves out", "Writing the questions"];
let workTimer = null;
function working(title) {
  clearInterval(workTimer);
  $("working").hidden = !title;
  if (!title) return;
  const t0 = Date.now();
  const tick = () => {
    const sec = Math.round((Date.now() - t0) / 1000);
    $("workingTitle").textContent = title;
    $("workingStep").textContent = STEPS[Math.min(STEPS.length - 1, Math.floor(sec / 8))] + "...";
    $("workingTime").textContent = `${sec}s elapsed. This usually takes 20 to 60 seconds.`;
  };
  tick(); workTimer = setInterval(tick, 1000);
}

async function ingest(promise, label) {
  busy(true); say(""); working(label);
  try { await promise(); S.selected = null; resetPM(); await load(); say(label === "Clearing" ? "Board cleared." : "Map built. Your product manager has questions for you, on the right."); }
  catch (err) { say(err.message, true); }
  finally { busy(false); working(""); }
}
$("buildBtn").onclick = () => ingest(() => api(`/api/ingest-prd?${eq()}`, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prd_markdown: $("prd").value }),
}), `${ENGINE_COPY[S.engine][0]} is reading your spec`);
$("file").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  ingest(() => api(`/api/ingest-file?${eq()}`, { method: "POST", body: fd }), `${ENGINE_COPY[S.engine][0]} is reading ${f.name}`);
  e.target.value = "";
};
$("exampleBtn").onclick = async () => {
  try { $("prd").value = await (await fetch("/examples/food-delivery-prd.md")).text(); say("Example loaded. Press Build graph."); }
  catch (err) { say("Could not load the example.", true); }
};
$("sampleBtn").onclick = () => ingest(() => api("/api/reset", { method: "POST" }), "Clearing");

function renderEngine() {
  $("gate").hidden = !!S.engine;
  $("engineCards").innerHTML = Object.entries(ENGINE_COPY).map(([k, [name, blurb]]) => {
    const e = S.engines[k] || {};
    return `<button class="engine" data-engine="${k}"><b>${name}</b><small>${blurb}</small>
      <span class="mono">${e.enabled ? `Connected · ${esc(e.model)}` : "Key not added yet"}</span></button>`;
  }).join("");
  const e = S.engines[S.engine];
  const pill = $("status");
  pill.className = "pill " + (e && e.enabled ? "on" : "off");
  pill.textContent = !S.engine ? "No engine chosen" : e && e.enabled ? `${ENGINE_COPY[S.engine][0]}: ${e.model}` : `${ENGINE_COPY[S.engine][0]} not connected (add its key to .env)`;
  $("buildBtn").disabled = !engineReady();
}
$("engineCards").onclick = (ev) => {
  const b = ev.target.closest("[data-engine]"); if (!b) return;
  S.engine = b.dataset.engine;
  try { localStorage.setItem("bb_engine", S.engine); } catch (e) {}
  renderEngine(); renderInspector();
};
$("switchEngine").onclick = () => { S.engine = null; renderEngine(); };

load().catch((err) => say(err.message, true));
</script>
</body>
