<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildingBees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10; --panel: #12151a; --card: #181c22; --line: #262b33;
    --text: #e8eaed; --muted: #8b93a1; --accent: #f5b301; --accent-ink: #1a1400;
    --ok: #3ccf8e; --warn: #f0a33a; --bad: #f2555a; --sel: #2a3140;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .hex { width: 22px; height: 22px; background: var(--accent); clip-path: polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%); }
  .product { color: var(--muted); }
  .pill { margin-left: auto; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.on { color: var(--ok); border-color: #1f5a40; }
  .pill.off { color: var(--warn); border-color: #5a4320; }
  main { display: grid; grid-template-columns: 300px 1fr 360px; height: calc(100vh - 53px); }
  aside, section { overflow: auto; padding: 16px; }
  aside.left { border-right: 1px solid var(--line); background: var(--panel); }
  aside.right { border-left: 1px solid var(--line); background: var(--panel); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  textarea { width: 100%; min-height: 200px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 13px/1.4 Inter, sans-serif; resize: vertical; }
  .btn { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); margin-top: 8px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .file { display: block; margin-top: 8px; padding: 9px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; cursor: pointer; }
  .file input { display: none; }
  .msg { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 18px; }
  .msg.err { color: var(--bad); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); }
  .crumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
  .crumbs button { background: none; border: none; color: var(--accent); padding: 0; }
  .board { display: grid; grid-template-columns: repeat(5, minmax(170px, 1fr)); gap: 12px; align-items: start; }
  .col h2 { display: flex; justify-content: space-between; }
  .node { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
  .node:hover { border-color: #3a4250; }
  .node.sel { border-color: var(--accent); background: var(--sel); }
  .node.dim { opacity: .35; }
  .node .t { font-weight: 600; font-size: 13px; }
  .node .id { color: var(--muted); margin-top: 2px; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .badge { display: inline-block; margin-top: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; }
  .badge.block { background: #3a1517; color: var(--bad); }
  .badge.ready { background: #123326; color: var(--ok); }
  .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 12px; margin-bottom: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-word; }
  .kv dd.missing { color: var(--bad); }
  .q { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .q.nb { border-left-color: var(--warn); }
  .q.done { border-left-color: var(--ok); opacity: .75; }
  .q .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .q input { width: 100%; margin-top: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px; font: inherit; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--text); }
  .score { font-size: 28px; font-weight: 700; }
  .reasons { font-size: 12px; color: var(--muted); padding-left: 16px; margin: 6px 0 14px; }
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; height: auto; }
    aside.left, aside.right { border: none; border-bottom: 1px solid var(--line); }
    .board { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="hex"></div>BuildingBees</div>
  <div class="product" id="product"></div>
  <div class="pill" id="status">Checking Gemini...</div>
</header>
<main>
  <aside class="left">
    <h2>1. Bring your spec</h2>
    <textarea id="prd" placeholder="Paste a PRD, feature brief or user story. Gemini turns it into Users, Flows, Screens, CTAs and APIs, then asks about everything the spec leaves out."></textarea>
    <button class="btn primary" id="buildBtn">Build graph with Gemini</button>
    <label class="file">or upload a PDF / .md file<input type="file" id="file" accept=".pdf,.md,.txt"></label>
    <button class="btn" id="sampleBtn">Load PCOS checkout sample</button>
    <div class="msg" id="msg"></div>
    <div class="stats" id="stats"></div>
  </aside>

  <section>
    <div class="crumbs" id="crumbs"></div>
    <div class="board" id="board"></div>
  </section>

  <aside class="right" id="inspector">
    <h2>Inspector</h2>
    <div class="empty">Select any node. Agents may not build a screen until every blocking question in its branch is answered: assumption is not approval.</div>
  </aside>
</main>

<script>
const LAYERS = ["USER", "FLOW", "SCREEN", "CTA", "API"];
const LABEL = { USER: "Users", FLOW: "Flows", SCREEN: "Screens", CTA: "CTAs", API: "APIs" };
let S = { nodes: {}, fwd: {}, rev: {}, screens: {}, gemini: false, selected: null };

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `Request failed (${res.status})`);
  return body;
}
function say(text, err = false) { $("msg").textContent = text; $("msg").className = "msg" + (err ? " err" : ""); }
function busy(on) { ["buildBtn", "sampleBtn"].forEach((id) => ($(id).disabled = on)); }

async function load() {
  const [g, screens, status] = await Promise.all([api("/api/graph"), api("/api/screens"), api("/api/status")]);
  S.nodes = {}; S.fwd = {}; S.rev = {}; S.screens = {};
  g.nodes.forEach((n) => (S.nodes[n.id] = n));
  g.edges.forEach((e) => {
    (S.fwd[e.source] ||= []).push(e.target);
    (S.rev[e.target] ||= []).push(e.source);
  });
  screens.forEach((r) => (S.screens[r.screen_id] = r));
  S.gemini = status.gemini.enabled;
  $("product").textContent = status.product_name;
  const pill = $("status");
  pill.className = "pill " + (S.gemini ? "on" : "off");
  pill.textContent = S.gemini ? `Gemini connected: ${status.gemini.model}` : "Gemini not connected (add GEMINI_API_KEY)";
  if (S.selected && !S.nodes[S.selected]) S.selected = null;
  render();
}

const questionsFor = (id) => Object.values(S.nodes).filter((n) => n.layer === "QUESTION" && n.target_node_id === id);
const openBlocking = (id) => questionsFor(id).filter((q) => q.question_status === "OPEN" && q.is_blocking).length;

// Everything connected to the selection, up and down, so the board "zooms" into one path.
function related(id) {
  const seen = new Set([id]);
  const walk = (start, map) => {
    const stack = [start];
    while (stack.length) for (const nx of map[stack.pop()] || []) if (!seen.has(nx)) { seen.add(nx); stack.push(nx); }
  };
  walk(id, S.fwd); walk(id, S.rev);
  return seen;
}
function screenOf(id) {
  const n = S.nodes[id];
  if (!n) return null;
  if (n.layer === "SCREEN") return id;
  if (n.layer === "CTA") return n.parent_screen_id;
  if (n.layer === "API") return (S.rev[id] || []).map((c) => S.nodes[c]?.parent_screen_id).find(Boolean) || null;
  return null;
}
function color(score) { return score >= 0.8 ? "var(--ok)" : score > 0 ? "var(--warn)" : "var(--bad)"; }

function render() {
  const all = Object.values(S.nodes);
  const rel = S.selected ? related(S.selected) : null;

  const crumbs = ['<button data-id="">All</button>'];
  if (S.selected) {
    const chain = [S.selected];
    let cur = S.selected;
    while ((S.rev[cur] || []).length && chain.length < 6) {
      cur = S.rev[cur].find((p) => S.nodes[p] && S.nodes[p].layer !== "QUESTION");
      if (!cur) break;
      chain.unshift(cur);
    }
    chain.forEach((id) => crumbs.push(`<span>/</span><button data-id="${esc(id)}">${esc(S.nodes[id].title)}</button>`));
  }
  $("crumbs").innerHTML = crumbs.join(" ");

  $("board").innerHTML = LAYERS.map((layer) => {
    const items = all.filter((n) => n.layer === layer);
    const cards = items.map((n) => {
      const ob = openBlocking(n.id);
      const r = layer === "SCREEN" ? S.screens[n.id] : null;
      const cls = ["node", n.id === S.selected ? "sel" : "", rel && !rel.has(n.id) ? "dim" : ""].join(" ");
      return `<div class="${cls}" data-id="${esc(n.id)}">
        <div class="t">${esc(n.layer === "CTA" ? `"${n.label}"` : n.title)}</div>
        <div class="id mono">${esc(n.id)}</div>
        ${r ? `<div class="bar"><i style="width:${Math.max(4, r.readiness_score * 100)}%;background:${color(r.readiness_score)}"></i></div>` : ""}
        ${ob ? `<span class="badge block">${ob} blocking</span>` : r && r.is_build_ready ? '<span class="badge ready">Ready to build</span>' : ""}
      </div>`;
    }).join("") || '<div class="empty">None yet</div>';
    return `<div class="col"><h2><span>${LABEL[layer]}</span><span>${items.length}</span></h2>${cards}</div>`;
  }).join("");

  const qs = all.filter((n) => n.layer === "QUESTION");
  const rs = Object.values(S.screens);
  $("stats").innerHTML = [
    [all.length - qs.length, "spec nodes"],
    [qs.filter((q) => q.question_status === "OPEN" && q.is_blocking).length, "open blocking"],
    [qs.filter((q) => q.question_status === "ANSWERED").length, "answered"],
    [`${rs.filter((r) => r.is_build_ready).length}/${rs.length}`, "screens ready"],
  ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

  renderInspector();
}

const FIELDS = {
  USER: [["description", "About"]],
  FLOW: [["goal", "Goal"]],
  SCREEN: [["description", "Purpose"], ["states.loading", "Loading"], ["states.empty", "Empty"], ["states.error", "Error"]],
  CTA: [["apis_called", "Calls"], ["target_screen_on_success", "On success"], ["target_screen_on_failure", "On failure"], ["max_retries", "Max retries"]],
  API: [["method", "Method"], ["path", "Path"], ["service", "Service"], ["vendor", "Vendor"], ["timeout_ms", "Timeout (ms)"]],
};
const pick = (o, path) => path.split(".").reduce((v, k) => (v == null ? v : v[k]), o);

function renderInspector() {
  const el = $("inspector");
  const n = S.nodes[S.selected];
  if (!n) return;
  const rows = (FIELDS[n.layer] || []).map(([path, label]) => {
    let v = pick(n, path);
    if (Array.isArray(v)) v = v.join(", ");
    const missing = v === "" || v == null || (path === "timeout_ms" && !v);
    return `<dt>${label}</dt><dd class="${missing ? "missing" : ""}">${missing ? "Not specified" : esc(v)}</dd>`;
  }).join("");

  const sid = screenOf(n.id);
  const r = sid && S.screens[sid];
  const readiness = r ? `<h2>Branch readiness: ${esc(sid)}</h2>
    <div class="score" style="color:${color(r.readiness_score)}">${Math.round(r.readiness_score * 100)}%</div>
    <ul class="reasons">${r.completeness_reasons.map((x) => `<li>${esc(x)}</li>`).join("") || "<li>Every blocking question answered. Agents may build.</li>"}</ul>` : "";

  const qs = questionsFor(n.id);
  const qhtml = qs.map((q) => {
    const done = q.question_status !== "OPEN";
    return `<div class="q ${done ? "done" : q.is_blocking ? "" : "nb"}">
      <div class="meta">${esc(q.category)} · ${q.is_blocking ? "Blocking" : "Non-blocking"} · for ${esc(q.assigned_to)}${q.metadata?.source === "gemini" ? " · asked by Gemini" : ""}</div>
      <div>${esc(q.question_text)}</div>
      ${done ? `<div class="meta" style="margin-top:6px;color:var(--ok)">Answer: ${esc(q.answer_text)}</div>` : `
        ${q.suggested_options?.length ? `<div class="chips">${q.suggested_options.map((o) => `<button class="chip" data-q="${esc(q.id)}" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}
        <input placeholder="Type the decision and press Enter" data-answer="${esc(q.id)}">`}
    </div>`;
  }).join("") || '<div class="empty">No questions on this node yet.</div>';

  const canAsk = ["SCREEN", "CTA", "API", "FLOW"].includes(n.layer);
  el.innerHTML = `<h2>${esc(n.layer)}</h2>
    <div style="font-weight:600;font-size:16px">${esc(n.title)}</div>
    <div class="mono" style="color:var(--muted);margin-bottom:12px">${esc(n.id)}</div>
    <dl class="kv">${rows}</dl>
    ${readiness}
    <h2>Questions (${qs.length})</h2>
    ${qhtml}
    ${canAsk ? `<button class="btn primary" id="askBtn" ${S.gemini ? "" : "disabled title='Connect Gemini first'"}>Ask Gemini what this node is missing</button>` : ""}
    <div class="msg" id="imsg"></div>`;
}

async function answer(qid, text) {
  if (!text.trim()) return;
  await api(`/api/questions/${encodeURIComponent(qid)}/resolve`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answer_text: text }),
  });
  await load();
}

document.addEventListener("click", async (e) => {
  const node = e.target.closest("[data-id]");
  if (node && (node.classList.contains("node") || node.closest("#crumbs"))) {
    S.selected = node.dataset.id || null;
    if (!S.selected) $("inspector").innerHTML = '<h2>Inspector</h2><div class="empty">Select any node.</div>';
    return render();
  }
  if (e.target.dataset.opt) return answer(e.target.dataset.q, e.target.dataset.opt).catch((err) => say(err.message, true));
  if (e.target.id === "askBtn") {
    e.target.disabled = true; e.target.textContent = "Gemini is reading the spec...";
    try {
      const res = await api(`/api/nodes/${encodeURIComponent(S.selected)}/interrogate`, { method: "POST" });
      await load();
      $("imsg").textContent = `Gemini added ${res.added.length} question(s).`;
    } catch (err) { renderInspector(); $("imsg").textContent = err.message; $("imsg").className = "msg err"; }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset.answer) answer(e.target.dataset.answer, e.target.value).catch((err) => say(err.message, true));
});

async function ingest(promise, label) {
  busy(true); say(`${label}... this can take 20 to 60 seconds.`);
  try { await promise(); S.selected = null; await load(); say("Graph built. Red badges are what your spec leaves out."); }
  catch (err) { say(err.message, true); }
  finally { busy(false); }
}
$("buildBtn").onclick = () => ingest(() => api("/api/ingest-prd", {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prd_markdown: $("prd").value }),
}), "Gemini is reading your spec");
$("file").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  ingest(() => api("/api/ingest-file", { method: "POST", body: fd }), `Gemini is reading ${f.name}`);
  e.target.value = "";
};
$("sampleBtn").onclick = () => ingest(() => api("/api/reset", { method: "POST" }), "Loading sample");

load().catch((err) => say(err.message, true));
</script>
</body>
</html>
