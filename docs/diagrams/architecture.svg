<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 564" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">BuildingBees architecture</title>
        <desc id="architecture-desc">The browser board sends ideas and answers to a FastAPI server on Cloud Run, which calls Gemini or Nemotron through one adapter; every reply passes a schema check before it changes the board graph, which is saved to Firestore and exported as a Brief, OpenAPI file, live mock and MCP server for coding agents.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:  #f7f7f5;
      --color-ink:    #111110;
      --color-muted:  #64635f;
      --color-accent: #8a5a00;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64635f"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a5a00"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f7f7f5"/>

        <!-- Arrows first, so lines sit behind the boxes -->
        <g fill="none" stroke-width="1.4">
          <!-- Board to server (answers) and back (board JSON) -->
          <line x1="184" y1="224" x2="262" y2="224" stroke="#64635f" marker-end="url(#architecture-arrow)"/>
          <line x1="264" y1="248" x2="186" y2="248" stroke="#64635f" stroke-dasharray="5,4" marker-end="url(#architecture-arrow)"/>
          <!-- Server to adapter -->
          <line x1="444" y1="236" x2="502" y2="236" stroke="#64635f" marker-end="url(#architecture-arrow)"/>
          <!-- Adapter to the two engines (one per deployment) -->
          <line x1="584" y1="200" x2="584" y2="106" stroke="#2e5aa8" marker-end="url(#architecture-arrow-link)"/>
          <line x1="664" y1="200" x2="664" y2="106" stroke="#2e5aa8" marker-end="url(#architecture-arrow-link)"/>
          <!-- Adapter reply into the guardrail (headline path) -->
          <line x1="624" y1="272" x2="624" y2="338" stroke="#8a5a00" marker-end="url(#architecture-arrow-accent)"/>
          <!-- Only valid output reaches the board -->
          <line x1="504" y1="376" x2="446" y2="376" stroke="#8a5a00" marker-end="url(#architecture-arrow-accent)"/>
          <!-- Server builds the board -->
          <line x1="354" y1="272" x2="354" y2="338" stroke="#64635f" marker-end="url(#architecture-arrow)"/>
          <!-- Board saved to Firestore -->
          <line x1="264" y1="376" x2="186" y2="376" stroke="#64635f" marker-end="url(#architecture-arrow)"/>
          <!-- Board exported for coding agents -->
          <path d="M 354 412 L 354 456 Q 354 464 362 464 L 896 464 Q 904 464 904 456 L 904 414" stroke="#64635f" marker-end="url(#architecture-arrow)"/>
        </g>

        <!-- Arrow labels on opaque masks, kept clear of their strokes -->
        <g font-family="Geist Mono, monospace" font-size="9" letter-spacing="0.08em" fill="#64635f" text-anchor="middle">
          <rect x="196" y="204" width="56" height="12" fill="#f7f7f5"/><text x="224" y="213">ANSWERS</text>
          <rect x="194" y="256" width="60" height="12" fill="#f7f7f5"/><text x="224" y="265">BOARD JSON</text>
          <rect x="452" y="216" width="44" height="12" fill="#f7f7f5"/><text x="474" y="225">PROMPT</text>
          <rect x="632" y="300" width="32" height="12" fill="#f7f7f5"/><text x="648" y="309">JSON</text>
          <rect x="452" y="356" width="44" height="12" fill="#f7f7f5"/><text x="474" y="365" fill="#8a5a00">VALID</text>
          <rect x="362" y="300" width="40" height="12" fill="#f7f7f5"/><text x="382" y="309">BUILD</text>
          <rect x="204" y="356" width="40" height="12" fill="#f7f7f5"/><text x="224" y="365">SAVE</text>
          <rect x="596" y="472" width="56" height="12" fill="#f7f7f5"/><text x="624" y="481">EXPORT</text>
        </g>

        <!-- Nodes: mask, box, tag, name, sublabel -->
        <g font-family="Geist, sans-serif">
          <!-- Engines (external) -->
          <rect x="464" y="40" width="160" height="64" rx="6" fill="#f7f7f5"/>
          <rect x="464" y="40" width="160" height="64" rx="6" fill="#111110" stroke="#111110" fill-opacity="0.03" stroke-opacity="0.30"/>
          <rect x="476" y="50" width="76" height="14" rx="2" fill="none" stroke="#111110" stroke-opacity="0.30"/>
          <text x="514" y="60" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.08em" fill="#64635f" text-anchor="middle">GOOGLE TRACK</text>
          <text x="476" y="82" font-size="13" font-weight="600" fill="#111110">Gemini 3.1 Pro</text>
          <text x="476" y="96" font-family="Geist Mono, monospace" font-size="9" fill="#64635f">Agent Platform, API key</text>

          <rect x="644" y="40" width="160" height="64" rx="6" fill="#f7f7f5"/>
          <rect x="644" y="40" width="160" height="64" rx="6" fill="#111110" stroke="#111110" fill-opacity="0.03" stroke-opacity="0.30"/>
          <rect x="656" y="50" width="76" height="14" rx="2" fill="none" stroke="#111110" stroke-opacity="0.30"/>
          <text x="694" y="60" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.08em" fill="#64635f" text-anchor="middle">NVIDIA TRACK</text>
          <text x="656" y="82" font-size="13" font-weight="600" fill="#111110">Nemotron 3</text>
          <text x="656" y="96" font-family="Geist Mono, monospace" font-size="9" fill="#64635f">Nebius Token Factory</text>

          <!-- Board (input) -->
          <rect x="24" y="200" width="160" height="72" rx="6" fill="#f7f7f5"/>
          <rect x="24" y="200" width="160" height="72" rx="6" fill="#64635f" stroke="#64635f" fill-opacity="0.10"/>
          <rect x="36" y="212" width="56" height="14" rx="2" fill="none" stroke="#64635f"/>
          <text x="64" y="222" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.08em" fill="#64635f" text-anchor="middle">BROWSER</text>
          <text x="36" y="246" font-size="13" font-weight="600" fill="#111110">The board</text>
          <text x="36" y="262" font-family="Geist Mono, monospace" font-size="9" fill="#64635f">web/index.html</text>

          <!-- Server (backend) -->
          <rect x="264" y="200" width="180" height="72" rx="6" fill="#f7f7f5"/>
          <rect x="264" y="200" width="180" height="72" rx="6" fill="#ffffff" stroke="#111110"/>
          <rect x="276" y="212" width="64" height="14" rx="2" fill="none" stroke="#111110"/>
          <text x="308" y="222" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.08em" fill="#111110" text-anchor="middle">CLOUD RUN</text>
          <text x="276" y="246" font-size="13" font-weight="600" fill="#111110">FastAPI server</text>
          <text x="276" y="262" font-family="Geist Mono, monospace" font-size="9" fill="#64635f">src/api/server.py</text>

          <!-- Adapter (backend) -->
          <rect x="504" y="200" width="240" height="72" rx="6" fill="#f7f7f5"/>
          <rect x="504" y="200" width="240" height="72" rx="6" fill="#ffffff" stroke="#111110"/>
          <rect x="516" y="212" width="56" height="14" rx="2" fill="none" stroke="#111110"/>
          <text x="544" y="222" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.08em" fill="#111110" text-anchor="middle">ADAPTER</text>
          <text x="516" y="246" font-size="13" font-weight="600" fill="#111110">Engine adapter, six bees</text>
          <text x="516" y="262" font-family="Geist Mono, monospace" font-size="9" fill="#64635f">src/adapters/spec_prompts.py</text>

          <!-- Guardrail (focal) -->
          <rect x="504" y="340" width="240" height="72" rx="6" fill="#f7f7f5"/>
          <rect x="504" y="340" width="240" height="72" rx="6" fill="#fff6d6" stroke="#8a5a00"/>
          <rect x="516" y="352" width="64" height="14" rx="2" fill="none" stroke="#8a5a00"/>
          <text x="548" y="362" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.08em" fill="#8a5a00" text-anchor="middle">GUARDRAIL</text>
          <text x="516" y="386" font-size="13" font-weight="600" fill="#111110">Schema check, strip_guesses</text>
          <text x="516" y="402" font-family="Geist Mono, monospace" font-size="9" fill="#64635f">Pydantic, src/core/ingest.py</text>

          <!-- Board graph (focal) -->
          <rect x="264" y="340" width="180" height="72" rx="6" fill="#f7f7f5"/>
          <rect x="264" y="340" width="180" height="72" rx="6" fill="#fff6d6" stroke="#8a5a00"/>
          <rect x="276" y="352" width="44" height="14" rx="2" fill="none" stroke="#8a5a00"/>
          <text x="298" y="362" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.08em" fill="#8a5a00" text-anchor="middle">STATE</text>
          <text x="276" y="386" font-size="13" font-weight="600" fill="#111110">Board graph</text>
          <text x="276" y="402" font-family="Geist Mono, monospace" font-size="9" fill="#64635f">src/core/graph.py</text>

          <!-- Firestore (store) -->
          <rect x="24" y="340" width="160" height="72" rx="6" fill="#f7f7f5"/>
          <rect x="24" y="340" width="160" height="72" rx="6" fill="#111110" stroke="#64635f" fill-opacity="0.05"/>
          <rect x="36" y="352" width="44" height="14" rx="2" fill="none" stroke="#64635f"/>
          <text x="58" y="362" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.08em" fill="#64635f" text-anchor="middle">STORE</text>
          <text x="36" y="386" font-size="13" font-weight="600" fill="#111110">Firestore</text>
          <text x="36" y="402" font-family="Geist Mono, monospace" font-size="9" fill="#64635f">boards, feedback</text>

          <!-- Outputs (backend) -->
          <rect x="804" y="340" width="212" height="72" rx="6" fill="#f7f7f5"/>
          <rect x="804" y="340" width="212" height="72" rx="6" fill="#ffffff" stroke="#111110"/>
          <rect x="816" y="352" width="72" height="14" rx="2" fill="none" stroke="#111110"/>
          <text x="852" y="362" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.08em" fill="#111110" text-anchor="middle">FOR AGENTS</text>
          <text x="816" y="386" font-size="13" font-weight="600" fill="#111110">Brief, OpenAPI, mock, MCP</text>
          <text x="816" y="402" font-family="Geist Mono, monospace" font-size="9" fill="#64635f">src/core/brief.py, docs.py</text>
        </g>

        <!-- Editorial callout -->
        <g font-family="Instrument Serif, serif" font-style="italic" font-size="15" fill="#111110">
          <text x="828" y="64">One engine per deployment:</text>
          <text x="828" y="84">the two tracks never mix.</text>
        </g>

        <!-- Legend strip -->
        <line x1="24" y1="508" x2="1016" y2="508" stroke="#111110" stroke-opacity="0.12"/>
        <g font-family="Geist Mono, monospace" font-size="9" letter-spacing="0.06em" fill="#64635f">
          <rect x="24" y="528" width="14" height="10" rx="2" fill="#fff6d6" stroke="#8a5a00"/><text x="44" y="537">FOCAL: TRUST PATH</text>
          <rect x="164" y="528" width="14" height="10" rx="2" fill="#ffffff" stroke="#111110"/><text x="184" y="537">SERVICE</text>
          <rect x="254" y="528" width="14" height="10" rx="2" fill="#111110" stroke="#64635f" fill-opacity="0.05"/><text x="274" y="537">STORE</text>
          <rect x="334" y="528" width="14" height="10" rx="2" fill="#111110" stroke="#111110" fill-opacity="0.03" stroke-opacity="0.30"/><text x="354" y="537">EXTERNAL MODEL</text>
          <rect x="474" y="528" width="14" height="10" rx="2" fill="#64635f" stroke="#64635f" fill-opacity="0.10"/><text x="494" y="537">USER</text>
          <line x1="554" y1="533" x2="582" y2="533" stroke="#2e5aa8" stroke-width="1.4"/><text x="590" y="537">MODEL CALL</text>
          <line x1="684" y1="533" x2="712" y2="533" stroke="#64635f" stroke-width="1.4" stroke-dasharray="5,4"/><text x="720" y="537">RESPONSE</text>
        </g>
      </svg>
